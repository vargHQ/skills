name: Publish to ClawHub

on:
  push:
    branches: [main]
    paths:
      - "*/SKILL.md"
      - "*/references/**"
      - "*/scripts/**"
      - "*/assets/**"
      - ".github/workflows/publish-clawhub.yml"

  # Allow manual trigger for re-publish or version bumps
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (show what would be published)"
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed for git tagging

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Authenticate with ClawHub
        run: bunx clawhub@latest login --token "$CLAWHUB_TOKEN"
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Detect changed skills
        id: detect
        run: |
          # Find all skill directories (contain SKILL.md)
          SKILLS=$(find . -maxdepth 2 -name 'SKILL.md' -not -path './.git/*' | sed 's|/SKILL.md||;s|^\./||' | sort)
          echo "Found skills: $SKILLS"
          echo "skills<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SKILLS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Sync all skills to ClawHub
        id: publish
        if: github.event.inputs.dry_run != 'true'
        run: |
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          CHANGELOG="Auto-published from ${{ github.repository }}@${GITHUB_SHA::8}"

          set -o pipefail
          echo "Publishing all skills (bump: $BUMP)..."
          bunx clawhub@latest sync \
            --root . \
            --all \
            --no-input \
            --bump "$BUMP" \
            --changelog "$CHANGELOG" \
            --tags latest 2>&1 | tee /tmp/publish-output.txt || true

          # A version can exist on ClawHub without being public (held in moderation, or uploaded by hand). sync only
          # knows the latest public version, so it keeps proposing the taken number. Retry those skills explicitly:
          # first the version declared in SKILL.md (metadata.version), then the next free patch numbers.
          FAILED=$(grep -oE -- '- [a-z0-9-]+: Version [0-9]+\.[0-9]+\.[0-9]+ already exists' /tmp/publish-output.txt \
            | sed -E 's/^- ([a-z0-9-]+): Version ([0-9.]+) .*/\1 \2/' | sort -u || true)
          while read -r SKILL TAKEN; do
            [ -z "$SKILL" ] && continue
            DECLARED=$(grep -m1 -E '^\s+version:' "$SKILL/SKILL.md" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
            CANDIDATES=$(python3 - "$TAKEN" "$DECLARED" <<'PY'
          import sys
          v = lambda s: tuple(int(x) for x in s.split("."))
          taken, declared = v(sys.argv[1]), sys.argv[2]
          out = [declared] if declared and v(declared) > taken else []
          out += [f"{taken[0]}.{taken[1]}.{taken[2] + i}" for i in range(1, 6)]
          print(" ".join(dict.fromkeys(out)))
          PY
            )
            OK=""
            for VER in $CANDIDATES; do
              echo "Retrying $SKILL as $VER ($TAKEN is taken)..."
              if bunx clawhub@latest publish "$SKILL" --version "$VER" --changelog "$CHANGELOG" --tags latest \
                   --source-repo "${{ github.repository }}" --source-commit "$GITHUB_SHA" 2>&1 | tee -a /tmp/publish-output.txt; then
                OK=1; break
              fi
            done
            [ -n "$OK" ] || { echo "::error::$SKILL could not be published"; exit 1; }
          done <<< "$FAILED"

          if grep -qE 'Failed to publish' /tmp/publish-output.txt && [ -z "$FAILED" ]; then
            echo "::error::clawhub sync reported failures"; exit 1
          fi
          echo "done=true" >> "$GITHUB_OUTPUT"
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Tag release
        if: |
          github.event.inputs.dry_run != 'true' &&
          steps.publish.outputs.done == 'true'
        run: |
          TAG="publish-${GITHUB_SHA::8}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag -a "$TAG" -m "Published to ClawHub from ${GITHUB_SHA::8}"
            git push origin "$TAG"
            echo "Tagged and pushed $TAG"
          fi

      - name: Dry run
        if: github.event.inputs.dry_run == 'true'
        run: |
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          echo "DRY RUN — would sync with bump=$BUMP:"
          bunx clawhub@latest sync \
            --root . \
            --all \
            --no-input \
            --dry-run \
            --bump "$BUMP" 2>&1 | tee /tmp/publish-output.txt

      - name: Summary
        if: always()
        run: |
          echo "## ClawHub Publish Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "> Dry run -- nothing was published." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **Commit**: \`${GITHUB_SHA::8}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Bump**: ${{ github.event.inputs.bump || 'patch' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Skills**: ${{ steps.detect.outputs.skills }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Registry**: https://clawhub.ai" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/publish-output.txt ]; then
            echo "### Output" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/publish-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
